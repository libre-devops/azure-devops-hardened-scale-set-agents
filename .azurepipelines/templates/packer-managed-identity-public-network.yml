parameters:
  - name: codeLocation
    displayName: "Location of the script code"
    type: string

  - name: packerTemplateLocation
    displayName: "Location of the template code"
    type: string

  - name: serviceConnection
    displayName: "Service Connection"
    type: string

  - name: nsgId
    displayName: "NSG Id"
    type: string

  - name: scriptType
    displayName: "Type of script"
    type: string
    default: "pscore"
    values:
      - "bash"
      - "pscore"
      - "ps"

  - name: additionalEnvVars
    displayName: "Additional Environment Variables"
    type: object
    default: {}

steps:
  - task: AzureCLI@2
    displayName: 'Authenticate to Azure & set environment variables'
    name: 'AzureLogin'
    inputs:
      azureSubscription: ${{ parameters.serviceConnection }}
      scriptType: ${{ parameters.scriptType }}
      scriptLocation: inlineScript
      inlineScript: |
        # Set variables for the current job environment
        Write-Host "##vso[task.setvariable variable=ARM_CLIENT_ID]$env:servicePrincipalId"
        Write-Host "##vso[task.setvariable variable=ARM_TENANT_ID]$env:tenantId"
        Write-Host "##vso[task.setvariable variable=ARM_SUBSCRIPTION_ID]$(az account show --query id -o tsv)"
        Write-Host "##vso[task.setvariable variable=ARM_USE_MSI]$true"
      workingDirectory: ${{ parameters.codeLocation }}
      addSpnToEnvironment: true
    enabled: true

  - task: AzureCLI@2
    displayName: 'Run Packer'
    name: 'RunPacker'
    timeoutInMinutes: 120
    inputs:
      azureSubscription: ${{ parameters.serviceConnection }}
      scriptType: ${{ parameters.scriptType }}
      scriptLocation: inlineScript
      inlineScript: |
        ./Run-AzPackerPublicNetworkManagedIdentity.ps1 `
        -PackerTemplatePath ${{ parameters.packerTemplateLocation }} `
        -NsgId ${{ parameters.nsgId }}
      workingDirectory: ${{ parameters.codeLocation }}
      addSpnToEnvironment: true
    env:
      PKR_VAR_ARM_TENANT_ID: $(ARM_TENANT_ID)
      PKR_VAR_ARM_CLIENT_ID: $(ARM_CLIENT_ID)
      PKR_VAR_ARM_USE_MSI: $(ARM_OIDC_TOKEN)
      PKR_VAR_ARM_SUBSCRIPTION_ID: $(ARM_SUBSCRIPTION_ID)

      # Dynamically inject additional environment variables
      ${{ each envVar in parameters.additionalEnvVars }}:
        ${{ envVar.Key }}: ${{ envVar.Value }}